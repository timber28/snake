<!DOCTYPE html>
<html lang="en">

<head>
	<title>Snake</title>
	<link rel="icon" type="image/png" href="images/apple.png">
	<link rel="stylesheet" href="style.css">
</head>

<body>
	<!----------------- Main Home Screen ------------------->
	<div id="home">
		<img src="images/title.png" style="height: 33vh; padding: 1vh;" />
		<div id="options">
			<button id="play" onclick="startGame()" style="grid-column: 1/3">Play</button>
			<button>Snakes</button>
			<button>Achievements</button>
			<button>Settings</button>
			<button>Help</button>
		</div>

		<h2>Boards</h2>
		<svg id="boards" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 100">
		</svg>
	</div>

	<!--------------------- Settings ----------------------->
	<div id="settings" class="popup hidden">
		<h1>Settings</h1>
		<button class="close">×</button>

		<div id="volume">
			<span id="effects">
				<img />
				<input type="range" min="0" max="100" value="100" />
			</span>
			<span id="music">
				<img />
				<input type="range" min="0" max="100" value="100" />
			</span>
		</div>

		<div id="controls">
			<span>
				<label for="arrows"><img src="images/arrows.png"></label>
				<label for="wasd"><img src="images/wasd.png"></label>
			</span>

			<span>
				<input type="radio" id="arrows" name="controls">
				<input type="radio" id="wasd" name="controls">
			</span>
		</div>

		<button id="reset" onclick="profile.reset()">Reset</button>
	</div>

	<!------------------- Achievements --------------------->
	<div id="achievements" class="popup hidden">
		<h1>Achievements</h1>
		<button class="close">×</button>

		<div id="grid"></div> <!-- Will be created with js -->
	</div>

	<!---------------------- Snakes ------------------------>
	<div id="snakes" class="popup hidden">
		<h1>Snakes</h1>
		<button class="close">×</button>
		<div id="coinDisplay">
			<img class="coinImg" src="images/coin.png">
			<p>-</p>
		</div>

		<svg viewBox="-24 0 48 12.5" preserveAspectRatio="xMidYMid meet">
			<!-- Preview Snake -->
			<g id="previewSnake">
				<!-- Body -->
				<line x1="-5" y1="2" x2="5" y2="2" />

				<!-- Eyes -->
				<circle cx="4.5" cy="1.5" r="0.3" fill="white" />
				<circle cx="4.5" cy="2.5" r="0.3" fill="white" />
				<circle cx="4.5" cy="1.5" r="0.15" fill="black" />
				<circle cx="4.5" cy="2.5" r="0.15" fill="black" />
			</g>

			<!-- Menu -->
			<g id="snakeMenu">
				<g id="snakeChoices">
					<circle cx="-24" />
					<circle cx="-16" />
					<circle cx="-8" />
					<circle cx="0" />
					<circle cx="8" />
					<circle cx="16" />
					<circle cx="24" />
				</g>
				<g id="lockImages"></g> <!-- Filled with JS -->
			</g>
		</svg>

		<span id="selectBtns">
			<p id="selectedText">Selected</p>
			<button id="selectBtn">Select</button>
			<button id="unlockBtn">
				<img class="coinImg" src="images/coin.png">
				<span>-</span>
			</button>
		</span>
	</div>

	<!----------------------- Help ------------------------->
	<div id="help" class="popup hidden">
		<h1>Help</h1>
		<button class="close">×</button>
		<p>
			Use WASD or the Arrow Keys to change the direction your snake moves <br>
			Eat apples to grow and score points <br>
			Don't crash into walls or hit your own tail <br>
			Be careful, the longer you tail is, the harder it is to avoid <br>
			Try not to box yourself in
		</p>
	</div>

	<!-------------------- Game Board ---------------------->
	<div id="game" class="hidden">
		<svg>
			<g id="boardContainer"></g>
			<g id="applesContainer"></g>
			<g id="snakeContainer">
				<g id="connectors" stroke-linecap="round"></g>
				<g id="eyes">
					<circle cx="-0.05" cy="-0.1" fill="black" stroke="white" />
					<circle cx="-0.05" cy="0.1" fill="black" stroke="white" />
				</g>
			</g>
		</svg>
	</div>

	<!---------------------- Script ------------------------>
	<script src="utilities/jQuery.js"></script> <!-- Jquery -->
	<script src="data.js"></script>
	<script src="game.js"></script>
	<script src="interface.js"></script>
</body>

</html>
